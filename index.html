<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melodias</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3f5fa;color:#18233a;margin:0}main{max-width:960px;margin:35px auto;padding:20px}h1{text-align:center;margin-bottom:5px}.sub{text-align:center;color:#58647a}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:25px 0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#243e85;color:white;font-weight:650}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e0e7f7;color:#20356c}.modes{display:flex;justify-content:center;gap:10px;margin:20px 0}.mode.active{background:#243e85;color:white}.mode{background:#e0e7f7;color:#20356c}.testinfo{text-align:center;font-weight:700;margin:10px}.results{background:white;padding:18px;border-radius:16px;margin-top:18px}.review-item{border:1px solid #e1e6ef;border-radius:14px;padding:15px;margin:15px 0}.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.review-staff{padding:10px;border-radius:10px;background:#f7f9fc}.review-staff.wrong{background:#fff0f0;border:1px solid #e9aaaa}.review-staff.correct{background:#e7f9ef;border:1px solid #a2d9bb}.review-staff svg{width:100%;height:auto}.review-staff strong{display:block;margin-bottom:5px}@media(max-width:650px){.review-grid{grid-template-columns:1fr}}.results table{width:100%;border-collapse:collapse}.results td,.results th{padding:9px;border-bottom:1px solid #e5e8f0;text-align:left}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.option{background:white;border:3px solid transparent;border-radius:16px;padding:12px;text-align:left;box-shadow:0 3px 14px #23345412;color:#18233a;width:100%}.option.selected{border-color:#4469da}.option.correct{border-color:#1e9b65;background:#e7f9ef}.option.wrong{border-color:#d64d4d;background:#fff0f0}.letter{font-size:22px;font-weight:800;margin-left:8px}.option svg{display:block;width:100%;height:auto}.status{text-align:center;min-height:34px;margin:18px 0;font-size:18px;font-weight:600}.note{text-align:center;color:#68758d;font-size:13px;margin-top:25px}@media(max-width:650px){.answers{grid-template-columns:1fr}main{margin:10px auto;padding:12px}h1{font-size:25px}button{padding:11px 13px}}</style></head><body><main><h1>🎼 Melodias</h1><p class="sub">Ouve a melodia e escolhe a opção correta</p><div class="modes"><button class="mode active" id="training">Treino</button><button class="mode" id="testing">Teste (10 melodias)</button></div><div class="testinfo" id="testinfo"></div><div class="toolbar"><button id="play">▶ Ouvir melodia</button><button id="again" class="secondary">↻ Ouvir novamente</button><button id="check">✓ Verificar resposta</button><button id="new" class="secondary">＋ Novo exercício</button><button id="next" class="secondary" hidden>Seguinte →</button></div><div id="answers" class="answers"></div><div id="results" class="results" hidden></div><div class="status" id="status" aria-live="polite">Ouve a melodia e escolhe a opção correta.</div><p class="note">Piano com som reforçado e clave de Sol desenhada em vetor. No primeiro exercício, clica em «Ouvir melodia» para ativar o áudio.</p></main><script>
const names=['A','B','C','D'], $=id=>document.getElementById(id);let solution=[],variants=[],correct=0,selected=-1,revealed=false,playing=false,audio=null,mode="training",test=[],testIndex=0,testDone=false;
const rand=n=>Math.floor(Math.random()*n);const same=(a,b)=>a.every((v,i)=>v===b[i]);
function generate(){if(playing)return;const base=rand(7)+2;solution=[base];for(let i=1;i<5;i++){const steps=[-2,-1,1,2];const valid=steps.map(x=>solution[i-1]+x).filter(x=>x>=0&&x<=10);solution.push(valid[rand(valid.length)])}correct=rand(4);variants=[];for(let i=0;i<4;i++){if(i===correct){variants.push([...solution]);continue}let candidate,tries=0;do{candidate=[...solution];let positions=[1,2,3,4];let pos=positions[rand(positions.length)];let alternatives=[-2,-1,1,2].map(d=>candidate[pos]+d).filter(n=>n>=0&&n<=10&&n!==candidate[pos]);candidate[pos]=alternatives[rand(alternatives.length)];tries++}while((same(candidate,solution)||variants.some(v=>same(v,candidate)))&&tries<100);variants.push(candidate)}selected=-1;revealed=false;$('status').textContent='Ouve a melodia e escolhe a opção correta.';render()}
function staff(notes){let out='<svg viewBox="0 0 360 116" role="img" aria-label="Pauta musical com cinco notas">';for(let y=31;y<=79;y+=12)out+=`<line x1="8" x2="350" y1="${y}" y2="${y}" stroke="#596477" stroke-width="1.35"/>`;out+='<path d="M314 801Q300 854 291.0 906.0Q282 958 282 1012Q282 1059 288.5 1100.5Q295 1142 307 1177Q320 1217 341.0 1252.5Q362 1288 385.5 1311.0Q409 1334 427 1334Q451 1334 493 1249Q514 1206 524.0 1156.0Q534 1106 534 1049Q534 978 515.0 907.5Q496 837 459.5 775.0Q423 713 372 666L407 498Q422 500 432.0 501.0Q442 502 447 502Q508 502 556.0 467.5Q604 433 632.5 377.0Q661 321 661 254Q661 177 621.5 115.5Q582 54 503 25Q508 8 532 -117Q538 -147 541.0 -164.5Q544 -182 545.0 -195.0Q546 -208 546 -225Q546 -275 521.5 -314.5Q497 -354 455.5 -376.0Q414 -398 363 -398Q311 -398 271.0 -378.5Q231 -359 208.0 -324.5Q185 -290 185 -245Q185 -197 211.5 -165.0Q238 -133 287 -133Q329 -133 355.5 -163.5Q382 -194 382 -236Q382 -272 357.0 -299.0Q332 -326 292 -326H282Q308 -365 364 -365Q433 -365 472.0 -320.0Q511 -275 511 -205Q511 -188 507.0 -159.5Q503 -131 493 -91Q483 -51 477.5 -25.0Q472 1 470 12Q436 2 390 2Q304 2 222 52Q142 102 96.0 184.0Q50 266 50 361Q50 451 91 530Q132 609 192.5 675.0Q253 741 314 801ZM341 826Q364 838 390.0 870.5Q416 903 440.0 945.0Q464 987 479.0 1029.5Q494 1072 494 1106Q494 1142 483.0 1163.0Q472 1184 445 1184Q421 1184 398.5 1162.0Q376 1140 358.5 1103.5Q341 1067 331.0 1022.0Q321 977 321 930Q321 898 327.5 872.0Q334 846 341 826ZM398 379Q371 373 347.0 353.5Q323 334 308.5 306.5Q294 279 294 248Q294 223 307.0 196.5Q320 170 339 154Q352 142 365 136Q380 129 380 123Q380 120 370 117Q332 126 301.5 151.0Q271 176 253.5 211.5Q236 247 236 287Q236 330 253.5 370.0Q271 410 302.5 442.0Q334 474 374 490L345 641Q229 547 174.5 456.5Q120 366 120 277Q120 212 154.0 156.0Q188 100 247.0 65.5Q306 31 380 31Q400 31 420.5 35.0Q441 39 464 45ZM495 55Q593 97 593 227Q593 270 571.0 305.5Q549 341 512.0 362.0Q475 383 429 383Z" transform="translate(15 85) scale(.055 -.055)" fill="#18233a" aria-hidden="true"/>';notes.forEach((n,i)=>{let x=100+i*49,y=97-n*6;if(y>79||y<31){for(let ly= y>79?91:19; y>79?ly<=y:ly>=y;ly+=y>79?12:-12)out+=`<line x1="${x-19}" x2="${x+19}" y1="${ly}" y2="${ly}" stroke="#18233a" stroke-width="2.3" stroke-linecap="round"/>`}out+=`<ellipse cx="${x}" cy="${y}" rx="9" ry="6" fill="white" stroke="#18233a" stroke-width="2.7"/>`});return out+'</svg>'}
function render(){$('answers').innerHTML='';variants.forEach((v,i)=>{const b=document.createElement('button');b.className='option'+(selected===i?' selected':'')+(revealed&&i===correct?' correct':'')+(revealed&&selected===i&&i!==correct?' wrong':'');b.innerHTML=`<span class="letter">${names[i]}</span>${staff(v)}`;b.setAttribute('aria-label','Opção '+names[i]);b.setAttribute('aria-pressed',selected===i?'true':'false');b.onclick=()=>{if(revealed||playing||testDone)return;selected=i;if(mode==='test')test[testIndex].answer=i;render()};$('answers').appendChild(b)});$('check').hidden=mode==='test';$('new').hidden=mode==='test';$('next').hidden=mode!=='test'||testDone;$('next').textContent=testIndex===9?'Terminar teste':'Seguinte →';$('next').disabled=selected<0||playing;$('play').disabled=playing||testDone;$('again').disabled=playing||testDone;$('new').disabled=playing;$('training').classList.toggle('active',mode==='training');$('testing').classList.toggle('active',mode==='test');$('testinfo').textContent=mode==='test'?(testDone?'Teste concluído':`Melodia ${testIndex+1} de 10`):''}
let master=null;
function initAudio(){
 if(!audio){
  audio=new (window.AudioContext||window.webkitAudioContext)();
  const compressor=audio.createDynamicsCompressor();
  compressor.threshold.value=-17; compressor.knee.value=16;
  compressor.ratio.value=3; compressor.attack.value=.004; compressor.release.value=.19;
  master=audio.createGain();master.gain.value=.85;
  master.connect(compressor);compressor.connect(audio.destination);
 }
 return audio;
}
function piano(freq,start,duration){
 const ctx=audio;
 // Cada nota tem um ataque percussivo e parciais ligeiramente inarmónicos,
 // para se aproximar mais da sonoridade de cordas de piano.
 const voice=ctx.createGain();voice.gain.value=.68;
 const tone=ctx.createBiquadFilter();tone.type='lowpass';
 tone.frequency.setValueAtTime(5400,start);
 tone.frequency.exponentialRampToValueAtTime(1950,start+.32);
 tone.connect(voice);voice.connect(master);
 const release=start+duration;
 const partials=[1,.49,.26,.14,.085,.055,.035,.022];
 partials.forEach((amp,i)=>{
  const h=i+1;
  const osc=ctx.createOscillator(),env=ctx.createGain();
  osc.type='sine';
  const stretch=Math.sqrt(1+.00018*h*h);
  osc.frequency.setValueAtTime(freq*h*stretch,start);
  env.gain.setValueAtTime(.00001,start);
  env.gain.exponentialRampToValueAtTime(Math.max(.0001,amp*.32),start+.006+i*.001);
  env.gain.exponentialRampToValueAtTime(Math.max(.0001,amp*(i<2?.17:.07)),start+.11);
  env.gain.exponentialRampToValueAtTime(Math.max(.0001,amp*(i<2?.105:.023)),release);
  env.gain.exponentialRampToValueAtTime(.00001,release+.22);
  osc.connect(env);env.connect(tone);
  osc.start(start);osc.stop(release+.24);
 });
 // Pequeno ruído inicial que simula o ataque do martelo.
 const count=Math.floor(ctx.sampleRate*.028),buffer=ctx.createBuffer(1,count,ctx.sampleRate);
 const samples=buffer.getChannelData(0);
 for(let i=0;i<count;i++)samples[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*.005));
 const noise=ctx.createBufferSource(),ng=ctx.createGain(),nf=ctx.createBiquadFilter();
 noise.buffer=buffer;nf.type='bandpass';nf.frequency.value=2200;nf.Q.value=.75;
 ng.gain.value=.075;noise.connect(nf);nf.connect(ng);ng.connect(master);
 noise.start(start);
}
async function play(){if(playing)return;try{const ctx=initAudio();await ctx.resume();playing=true;render();$('status').textContent='♪ A tocar a melodia…';const start=ctx.currentTime+.08;solution.forEach((n,i)=>piano([246.941651,261.625565,293.664768,329.627557,349.228231,391.995436,440,493.883301,523.251131,587.329536,659.255114][n],start+i*.62,.52));setTimeout(()=>{playing=false;render();$('status').textContent=revealed?'Resposta correta: '+names[correct]:'Seleciona A, B, C ou D e verifica a resposta.'},Math.ceil((solution.length*.62+.25)*1000))}catch(e){playing=false;render();$('status').textContent='Não foi possível iniciar o áudio neste navegador.'}}
function beginTest(){if(playing)return;mode='test';test=[];testIndex=0;testDone=false;$('results').hidden=true;for(let k=0;k<10;k++){generate();test.push({solution:[...solution],variants:variants.map(v=>[...v]),correct,answer:-1})}loadTest(0)}
function loadTest(index){testIndex=index;const t=test[index];solution=[...t.solution];variants=t.variants.map(v=>[...v]);correct=t.correct;selected=t.answer;revealed=false;$('status').textContent='Ouve a melodia e escolhe uma opção. A correção aparece no final.';render()}
function finishTest(){testDone=true;revealed=false;const score=test.filter(t=>t.answer===t.correct).length;const reviews=test.map((t,i)=>{const ok=t.answer===t.correct;return `<section class="review-item"><h3>Melodia ${i+1} — ${ok?'✓ Correta':'✗ Incorreta'}</h3><div class="review-grid"><div class="review-staff ${ok?'correct':'wrong'}"><strong>A tua resposta: ${names[t.answer]}</strong>${staff(t.variants[t.answer])}</div><div class="review-staff correct"><strong>Resposta correta: ${names[t.correct]}</strong>${staff(t.variants[t.correct])}</div></div></section>`}).join('');$('results').innerHTML=`<h2>Resultado: ${score}/10 (${score*10}%)</h2><p>Compara a pauta que escolheste com a pauta correta em cada melodia.</p>${reviews}<p><button id="restart">Novo teste</button></p>`;$('results').hidden=false;$('restart').onclick=beginTest;$('status').textContent='Teste terminado. Consulta a correção e a pontuação.';render()}
$('training').onclick=()=>{if(playing)return;mode='training';testDone=false;$('results').hidden=true;generate()};$('testing').onclick=beginTest;$('next').onclick=()=>{if(playing||selected<0)return;if(testIndex===9)finishTest();else loadTest(testIndex+1)};
$('play').onclick=play;$('again').onclick=play;$('check').onclick=()=>{if(selected<0||revealed||playing)return;revealed=true;$('status').textContent=selected===correct?'✓ Muito bem! Resposta correta: '+names[correct]:'A resposta correta é '+names[correct]+'. Tenta novamente no próximo exercício!';render()};$('new').onclick=generate;generate();
</script></body></html>
